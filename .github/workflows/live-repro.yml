name: live-repro

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.POC_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          track_progress: "true"
          show_full_output: "true"
          claude_args: "--allowedTools Read"

      - name: Show prompt and user-request extracts
        if: always()
        run: |
          PROMPT_FILE=/home/runner/work/_temp/claude-prompts/claude-prompt.txt
          USER_REQUEST_FILE=/home/runner/work/_temp/claude-prompts/claude-user-request.txt

          if [ -f "$PROMPT_FILE" ]; then
            echo "PROMPT_FILE_PRESENT=yes"
            grep -nE 'TOKEN:|NO_TOKEN|<trigger_comment>|</trigger_comment>|<!--|-->' "$PROMPT_FILE" || true
          else
            echo "PROMPT_FILE_PRESENT=no"
          fi

          if [ -f "$USER_REQUEST_FILE" ]; then
            echo "USER_REQUEST_FILE_PRESENT=yes"
            grep -nE 'TOKEN:|NO_TOKEN|@claude|<!--|-->' "$USER_REQUEST_FILE" || true
            cat "$USER_REQUEST_FILE"
          else
            echo "USER_REQUEST_FILE_PRESENT=no"
          fi
