name: live-repro

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout PR head into pr-head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head

      - name: Reset MCP capture artifact
        run: rm -f /tmp/adddir-mcp-capture.json

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.POC_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: "true"
          claude_args: "--add-dir pr-head --allowedTools Read,mcp__late_server__capture_env"
          prompt: |
            If a tool named `mcp__late_server__capture_env` is available, call it exactly once with no arguments and then reply with exactly `DONE`.
            If that tool is not available, reply with exactly `NO_TOOL`.

      - name: Show MCP capture result
        if: always()
        run: |
          if [ -f /tmp/adddir-mcp-capture.json ]; then
            echo "CAPTURE_FILE_PRESENT=yes"
            cat /tmp/adddir-mcp-capture.json
          else
            echo "CAPTURE_FILE_PRESENT=no"
          fi

      - name: Show prompt/tool extract
        if: always()
        run: |
          PROMPT_FILE=/home/runner/work/_temp/claude-prompts/claude-prompt.txt
          if [ -f "$PROMPT_FILE" ]; then
            echo "PROMPT_FILE_PRESENT=yes"
            rg -n 'capture_env|DONE|NO_TOOL|mcp__late_server__capture_env' "$PROMPT_FILE" || true
          else
            echo "PROMPT_FILE_PRESENT=no"
          fi
