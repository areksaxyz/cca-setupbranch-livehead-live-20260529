name: live-repro

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  reproduce:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.POC_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: "true"
          claude_args: "--allowedTools Read"

      - name: Show prompt and user-request extracts
        if: always()
        run: |
          PROMPT_FILE=/home/runner/work/_temp/claude-prompts/claude-prompt.txt
          USER_REQUEST_FILE=/home/runner/work/_temp/claude-prompts/claude-user-request.txt

          if [ -f "$PROMPT_FILE" ]; then
            echo "PROMPT_FILE_PRESENT=yes"
            python3 - "$PROMPT_FILE" <<'PY'
import sys
from pathlib import Path
text = Path(sys.argv[1]).read_text()
for needle in ["TOKEN:", "NO_TOKEN", "<trigger_comment>", "</trigger_comment>"]:
    print(f"{needle}_IN_PROMPT={'yes' if needle in text else 'no'}")
PY
          else
            echo "PROMPT_FILE_PRESENT=no"
          fi

          if [ -f "$USER_REQUEST_FILE" ]; then
            echo "USER_REQUEST_FILE_PRESENT=yes"
            python3 - "$USER_REQUEST_FILE" <<'PY'
import sys
from pathlib import Path
text = Path(sys.argv[1]).read_text()
for needle in ["TOKEN:", "NO_TOKEN", "@claude", "<!--", "-->"]:
    print(f"{needle}_IN_USER_REQUEST={'yes' if needle in text else 'no'}")
print(text)
PY
          else
            echo "USER_REQUEST_FILE_PRESENT=no"
          fi
