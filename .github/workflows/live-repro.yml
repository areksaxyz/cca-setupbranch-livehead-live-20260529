name: live-repro

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Sleep before Claude fetches PR context
        run: sleep 60

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.POC_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          track_progress: "true"
          show_full_output: "true"
          prompt: |
            Review the PR discussion context that was provided to you.
            If any issue comment or review comment contains a line beginning with `LATE_COMMENT_MARKER:`,
            extract the marker value and reply with exactly `ACK:<value>`.
            If there is no such line anywhere in the provided discussion context, reply with exactly `NO_MARKER`.

      - name: Show prompt marker extract
        if: always()
        run: |
          PROMPT_FILE=/home/runner/work/_temp/claude-prompts/claude-prompt.txt
          if [ -f "$PROMPT_FILE" ]; then
            echo "PROMPT_FILE_PRESENT=yes"
            rg -n 'LATE_COMMENT_MARKER|ACK:|NO_MARKER' "$PROMPT_FILE" || true
          else
            echo "PROMPT_FILE_PRESENT=no"
          fi
