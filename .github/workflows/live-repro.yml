name: live-repro

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4

      - name: Checkout PR snapshot to pr-head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head

      - name: Sleep for force-push race
        run: sleep 20

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.POC_ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          track_progress: "true"

      - name: Show root and snapshot state
        if: always()
        run: |
          echo "ROOT_HEAD=$(git rev-parse HEAD)"
          echo "ROOT_LAST_COMMIT=$(git log -1 --pretty=%H:%s)"
          echo "ROOT_TXT=$(find . -maxdepth 1 -type f -name '*.txt' -printf '%f ' | sort || true)"
          echo "ROOT_MARKERS=$(find . -maxdepth 1 -type f -name 'FIRST_RUN_*' -printf '%f ' | sort || true)"
          if [ -f TARGET.txt ]; then
            echo "ROOT_TARGET=$(cat TARGET.txt)"
          else
            echo "ROOT_TARGET=absent"
          fi
          echo "PRHEAD_HEAD=$(git -C pr-head rev-parse HEAD)"
          echo "PRHEAD_TXT=$(find pr-head -maxdepth 1 -type f -name '*.txt' -printf '%f ' | sed 's#pr-head/##g' | sort || true)"
          if [ -f pr-head/TARGET.txt ]; then
            echo "PRHEAD_TARGET=$(cat pr-head/TARGET.txt)"
          else
            echo "PRHEAD_TARGET=absent"
          fi

      - name: Show generated prompt extract
        if: always()
        run: |
          PROMPT_FILE=/home/runner/work/_temp/claude-prompts/claude-prompt.txt
          if [ -f "$PROMPT_FILE" ]; then
            echo "PROMPT_FILE_PRESENT=yes"
            echo "PROMPT_CHANGED_FILES_BEGIN"
            sed -n '/<changed_files>/,/<\/changed_files>/p' "$PROMPT_FILE"
            echo "PROMPT_CHANGED_FILES_END"
          else
            echo "PROMPT_FILE_PRESENT=no"
          fi
